<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dev | Hitcal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --neo-mint: #baf3d4;
    --neo-lavender: #d9d3fb;
    --neo-sky: #bfe3fb;
    --neo-peach: #ffe0b5;
    --neo-coral: #ffc9c9;
    --primary: #2563eb;
    --ink: #0f172a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #eef1f7;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 110px;
  }
  .wrap { width: 100%; max-width: 460px; }

  .neo-card {
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 22px;
    box-shadow: 6px 6px 0px var(--ink);
    padding: 28px 24px;
  }

  .avatar-ring {
    width: 128px;
    height: 128px;
    border-radius: 28px;
    border: 3px solid var(--primary);
    padding: 4px;
    margin: 0 auto 18px;
    background: #0b1220;
    box-shadow: 4px 4px 0px var(--ink);
  }
  .avatar-ring img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 22px;
    display: block;
  }

  .name {
    text-align: center;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }

  .badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: fit-content;
    margin: 0 auto 18px;
    background: var(--neo-mint);
    color: var(--ink);
    font-weight: 800;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 999px;
    border: 2px solid var(--ink);
  }

  .desc {
    text-align: center;
    color: #475569;
    font-weight: 500;
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0 0 24px;
  }

  .link-row {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 2.5px solid var(--ink);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 14px;
    background: #fff;
  }
  .link-row:last-child { margin-bottom: 0; }

  .icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon svg { width: 22px; height: 22px; }

  .icon.wa { background: #25D366; }
  .icon.ig { background: linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7); }
  .icon.tiktok { background: #0f172a; }
  .icon.web { background: var(--neo-sky); }

  .link-text .label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #64748b;
    margin-bottom: 2px;
  }
  .link-text .value {
    font-size: 16px;
    font-weight: 800;
    color: var(--ink);
  }
  .link-row.disabled {
    opacity: 0.5;
  }

  /* bottom nav mimic */
  .nav {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 460px;
    background: rgba(255,255,255,0.97);
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    height: 66px;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15), 4px 4px 0px var(--ink);
    padding: 0 8px;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #64748b;
  }
  .nav-item.active { color: var(--ink); }
  .nav-item svg { width: 20px; height: 20px; }
  .nav-fab {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-fab .fab-btn {
    position: absolute;
    top: -28px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--primary);
    border: 2.5px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(37,99,235,0.35), 3px 3px 0px var(--ink);
  }
  .nav-fab .fab-btn svg { width: 24px; height: 24px; color: #fff; }
  .nav-fab .fab-label {
    position: absolute;
    bottom: 6px;
    font-size: 9px;
    font-weight: 800;
    text-transform: uppercase;
    color: #64748b;
  }
</style>
</head>
